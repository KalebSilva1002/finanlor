<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/telaHome.css">
    <link rel="stylesheet" href="../styles/styles.css">
    <title>Finanlor - Home</title>
</head>
<body>
    <header class="header-container-geral">
        <div class="header-div-logo">
            <img src="../img/logo_horizontal_bgescuro_semSlogan.svg" alt="Logo FinanLor" title="FinanLor">
        </div>

        <div class="header-div-botoes">
            <!-- botão da listinha de meses central de dados -->
            <div class="header-select-list-div">
                <svg class="icon-calendar-header" width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M5.5 4.5H18.5C19.8807 4.5 21 5.61929 21 7V19C21 20.3807 19.8807 21.5 18.5 21.5H5.5C4.11929 21.5 3 20.3807 3 19V7C3 5.61929 4.11929 4.5 5.5 4.5Z" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke="#FAFBFC"/>
                <path d="M16 2.5V6.5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke="#FAFBFC"/>
                <path d="M8 2.5V6.5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke="#FAFBFC"/>
                <path d="M3 10H21" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke="#FAFBFC"/>
                </svg>
                <div id="cont-button-meses-seta">
                    <select name="select-meses" id="listagem-meses">
                        <option value="">Outubro 26</option>
                        <option value="">Setembro 26</option>
                        <option value="">Agosto 26</option>
                        <option value="">Julho 26</option>
                    </select>
                    <svg class="icon-chevron-down-header" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M6 9L12 15L18 9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke="#FAFBFC"/>
                    </svg>

                </div>
            </div>
            <!-- barra de pesquisa de movimentações -->
            <div class="header-search-bar">
                <svg class="icon-search-header" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M18 11C18 14.866 14.866 18 11 18C7.13401 18 4 14.866 4 11C4 7.13401 7.13401 4 11 4C14.866 4 18 7.13401 18 11Z" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke="#FAFBFC"/>
                <path d="M20 20L16.5 16.5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke="#FAFBFC"/>
                </svg>
                <input type="text" placeholder="Pesquise uma movimentação">
            </div>
            <!-- icone de notificacao -->
            <div class="header-notification-button">
                <div class="header-notification">
                    <svg class="icon-notificacao-header" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M6 8C6 6.4087 6.63214 4.88258 7.75736 3.75736C8.88258 2.63214 10.4087 2 12 2C13.5913 2 15.1174 2.63214 16.2426 3.75736C17.3679 4.88258 18 6.4087 18 8C18 15 21 17 21 17H3C3 17 6 15 6 8Z" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke="#FAFBFC"/>
                    <path d="M10.2998 21C10.4672 21.3044 10.7133 21.5583 11.0123 21.7352C11.3113 21.912 11.6524 22.0053 11.9998 22.0053C12.3472 22.0053 12.6883 21.912 12.9873 21.7352C13.2864 21.5583 13.5324 21.3044 13.6998 21" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke="#FAFBFC"/>
                    </svg>
                    <svg class="icon-notifi-ball-header" width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="6" cy="6" r="5" fill="#4A86FA" stroke-width="2" stroke="#121722"/>
                    </svg>
                </div>
            </div>
            <!-- perfil -->
            <div class="header-button-perfil">
                <div class="header-pefil-logo">
                    <div id="img-logo-perfil"></div>
                </div>
                <img src="../img/icons/chevron-down.svg" alt="">
            </div>
        </div>
    </header>
</body>
</html>
